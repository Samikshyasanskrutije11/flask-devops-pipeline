<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask DevOps Pipeline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f172a; color: #e2e8f0;
    }
    .card {
      background: #1e293b; padding: 2.5rem 3rem; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: 520px; width: 90%;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    p.sub { margin: 0 0 1.5rem; color: #94a3b8; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: .5rem 1rem; margin: 0; }
    dt { color: #94a3b8; }
    dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .badge { display:inline-block; padding:.15rem .6rem; border-radius:999px;
             background:#15803d; color:#fff; font-size:.75rem; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Flask DevOps Pipeline <span class="badge">live</span></h1>
    <p class="sub">Deployed with Docker, Jenkins, Terraform and AWS EC2.</p>
    <dl>
      <dt>Version</dt><dd>{{ version }}</dd>
      <dt>Environment</dt><dd>{{ environment }}</dd>
      <dt>Container host</dt><dd>{{ hostname }}</dd>
    </dl>
    <p style="margin-top:1.5rem">
      Endpoints: <a href="/health">/health</a> &middot; <a href="/api/info">/api/info</a>
    </p>
  </div>
</body>
</html>
